name: Publish interactive demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build static demonstration
        run: node scripts/build-pages.mjs
      - name: Verify demo artifact and translations
        run: node --test tests/static-demo.test.mjs tests/i18n.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
